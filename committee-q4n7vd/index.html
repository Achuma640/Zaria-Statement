<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Zaria Village Committee Finance Status Report</title>
<style>
:root{--fg:#17231b;--mut:#5b6a60;--line:#c9d3cc;--green:#1f6b4a;--bar:#1f7a4d;--out:#c0392b;--gold:#b8860b;--hl:#eef5f0;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 14px 40px}
.wrap{max-width:860px;margin:0 auto}h1{font-size:19px;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 12px;font-size:12.5px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}.card h2{font-size:14px;margin:0 0 8px}
.bal{background:#fff8e6;border:2px solid var(--gold)}.bal small,.k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;color:#7a5a00;text-transform:uppercase}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{background:#f3f7f4;border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0}.t small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}.t b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.g2{grid-template-columns:repeat(2,1fr)}.in{color:var(--green)}.outc{color:var(--out)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.row small{display:block;color:var(--mut)}
.bar{height:6px;background:var(--hl);border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bar)}
.up{color:var(--out);font-weight:600}.dn{color:var(--green);font-weight:600}
a.lnk{display:flex;align-items:center;gap:12px;padding:14px 12px;border:2px solid var(--green);border-radius:12px;text-decoration:none;color:var(--fg);margin-bottom:10px;background:#f3f9f5;box-shadow:0 2px 0 rgba(31,107,74,.25)}a.lnk:active{background:#e4f1e8}a.lnk .ic{flex:0 0 40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}a.lnk .tx{flex:1;min-width:0}a.lnk .tx b{display:block;font-size:16px}a.lnk .tx span{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:2px}a.lnk .go2{flex:0 0 auto;background:var(--green);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;white-space:nowrap}a.lnk2 .ic{background:var(--out)}a.lnk2{border-color:var(--out);background:#fdf3f1}a.lnk2 .go2{background:var(--out)}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font:10px system-ui,sans-serif}
#gate .card{padding:16px}input.pin{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;font:inherit;padding:0 12px;margin:6px 0 10px}button.go{min-height:44px;width:100%;border:0;border-radius:8px;background:var(--green);color:#fff;font:inherit;font-weight:700}
.row.in small,.row.outc small{color:inherit;opacity:.85}.row.in b{color:var(--green)}.row.outc b{color:var(--out)}
[hidden]{display:none!important}
button.t{font:inherit;color:inherit;text-align:left;cursor:pointer}.pcur button.t.tap{border:2px solid var(--green);background:#fff}button.t.tap small{color:var(--green);font-weight:700}
.back{min-height:44px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;font-weight:700;padding:0 14px;margin-bottom:10px;cursor:pointer}
.srch{width:100%;min-height:44px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;padding:0 12px;margin-bottom:10px}
.drow{padding:10px 12px;border-bottom:1px solid var(--line)}.drow:last-child{border-bottom:0}.drow .l1{display:flex;justify-content:space-between;gap:10px}.drow .who{font-weight:600;overflow-wrap:anywhere}.drow .amt{font-weight:700;white-space:nowrap}.drow .why{margin-top:2px;overflow-wrap:anywhere}.drow .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut);font-size:12.5px;margin-top:4px;align-items:center}
.ref{font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:#f3f7f4;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.pcur{border:3px solid var(--green);background:#f3f9f5}.pcur h2{font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pcur .tag{font-size:10.5px;letter-spacing:.06em;background:var(--green);color:#fff;border-radius:999px;padding:3px 10px;font-weight:800}.pcur .t{background:#fff;border:2px solid var(--green)}.pcur .t b{font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--hl);border:2px solid var(--gold);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 10px 8px}
.seg::before{content:"CHOOSE A PERIOD: Day, Month, Quarter, Year or All time";flex:0 0 100%;font-size:11.5px;font-weight:800;letter-spacing:.04em}
.seg button{flex:1;padding:10px 2px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 0 2px var(--gold)}
.picker{display:flex;gap:4px;align-items:center;background:var(--hl);border:2px solid var(--gold);border-top:0;border-radius:0 0 12px 12px;padding:0 10px 8px;margin-bottom:10px}
.picker button{width:34px;min-height:38px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font-size:18px;cursor:pointer}.picker button:disabled{opacity:.35}
#mapbtn{margin-left:2px}#mapbtn svg{width:18px;height:18px;fill:currentColor}#mapbtn[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}.picker select,.picker input{flex:1;min-height:38px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:0 6px;min-width:0}
.opts{display:flex;gap:6px;margin:0 0 10px}.fbtn{min-height:38px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}.fbtn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.fpanel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 10px 4px;margin:0 0 12px}
.fpanel .fa{display:flex;gap:8px;padding:8px 0;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line)}.fpanel .fa button{min-height:34px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;padding:0 12px;cursor:pointer}.fpanel .fa .ap{margin-left:auto;background:var(--green);color:#fff;border-color:var(--green);font-weight:700;padding:0 22px}
.fpanel h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:10px 0 2px}.fpanel label{display:flex;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line)}.fpanel input{width:20px;height:20px}
.card{border-width:2px!important;border-style:solid!important;border-color:#8fa396!important}#fb{background:#0B3D91!important;color:#fff!important;border:2px solid #0B3D91!important;font-weight:800!important}#fb.on{box-shadow:0 0 0 2px var(--gold)}.latest{border-color:#1f6b4a!important;border-width:4px!important;background:#f3f9f5!important}.latest h2{font-size:16px;color:#1f6b4a}.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}.bgrid .big{font-size:19px}.bl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#7a5a00;text-transform:uppercase}a.t{text-decoration:none;color:inherit;display:block;cursor:pointer}.tn{display:block;margin-top:5px;font-size:11.5px;font-weight:700;color:#0B3D91;text-decoration:underline}.spall{display:block;width:100%;text-align:left;margin:2px 0 8px;padding:10px 12px;border:2px solid #0B3D91;border-radius:10px;background:#0B3D91;color:#fff;font:700 13.5px system-ui;cursor:pointer}.back{background:#c0392b!important;color:#fff!important;border:2px solid #c0392b!important;font-weight:800!important}.sortl{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:14px}.sortl select{flex:1;padding:10px;border:2px solid #0B3D91;border-radius:10px;font:600 14px system-ui;background:#fff;color:#1B2A22}</style></head><body><div class="wrap">
<div id="gate"><form id="gf" class="card"><h2 style="font-size:17px">Committee only</h2><p class="mut">Enter the PIN to open the status report.</p><input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"><label style="display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--mut)"><input type="checkbox" id="rem" checked> Remember on this phone</label><button class="go" type="submit">Open report</button><p id="gm" class="mut" role="status"></p></form></div>
<div id="app" hidden><h1>Zaria Village Committee Finance Status Report</h1><p class="sub" id="asat"></p><div class="seg" id="seg" role="group" aria-label="Period type"><button data-m="day">Day</button><button data-m="month">Month</button><button data-m="quarter">Quarter</button><button data-m="year">Year</button><button data-m="all">All time</button></div><div class="picker"><button id="prev" aria-label="Previous period">&#8249;</button><span id="pk" style="flex:1;display:flex;min-width:0"></span><button id="next" aria-label="Next period">&#8250;</button><button id="mapbtn" aria-label="Payment map" title="Payment map" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20.5 3l-.2.1L15 5.1 9 3 3.4 4.9a.5.5 0 0 0-.4.5v15.1a.5.5 0 0 0 .5.5l.2-.1L9 18.9l6 2.1 5.6-1.9a.5.5 0 0 0 .4-.5V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg></button></div><div class="opts"><button id="fb" class="fbtn">Choose Category (all)</button></div><div id="fp" class="fpanel" hidden></div><div id="rep"></div></div></div>
