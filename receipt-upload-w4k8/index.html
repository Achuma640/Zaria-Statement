<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Zaria receipts</title>
<style>
:root{--bg:#0F2B1F;--card:#173A2A;--bd:#3F7A5A;--gold:#D9B452;--tx:#F1E6C6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.4 system-ui,Arial,sans-serif;padding:18px;max-width:720px;margin:auto}
h1{color:var(--gold);font-size:28px;margin:6px 0 4px}p.s{margin:0 0 16px;opacity:.85}
.c{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
label{display:block;font-weight:700;color:var(--gold);margin:12px 0 6px;font-size:18px}
input,select,textarea,button{width:100%;font:inherit;font-size:19px;padding:13px;border-radius:10px;border:2px solid var(--bd);background:#0F2B1F;color:var(--tx)}
button{background:var(--gold);color:#0F2B1F;font-weight:800;border:0;margin-top:14px;padding:15px}button:disabled{opacity:.5}
.ok{color:#7FB88E;font-weight:700}.er{color:#ff9d8a;font-weight:700}a{color:var(--gold)}
.pill{display:inline-block;background:#0F2B1F;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;margin:3px 4px 0 0;font-size:16px}
</style></head><body>
<h1>Upload a receipt</h1><p class="s">Treasurers only. Saved to the Zaria Village Receipts folder and logged in the Sheet.</p>
<div class="c" id="gate"><label for="code">Upload code</label><input id="code" type="password" autocomplete="off"><button id="go">Continue</button><div id="gm"></div></div>
<div id="app" hidden>
 <div class="c"><label for="q">Find the payment (payee, amount or ref)</label><input id="q" placeholder="e.g. 200000 or Ridges or UG4K">
  <label for="pay">Payment</label><select id="pay" size="6" style="height:auto"></select><div id="info"></div></div>
 <div class="c"><label for="file">Receipt photo or PDF</label><input id="file" type="file" accept="image/*,application/pdf" multiple>
  <label for="tag">Tag</label><select id="tag"></select>
  <label for="note">Note (optional)</label><input id="note" placeholder="what it was for">
  <label for="by">Your name</label><input id="by" placeholder="treasurer name">
  <button id="up">Upload</button><div id="msg"></div></div>
</div>
<script>
var SCRIPT_URL='PASTE_WEB_APP_URL_HERE';
var $=function(i){return document.getElementById(i)},S=null,P=[],code='';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function msg(t,c){$('msg').innerHTML='<p class="'+(c||'')+'">'+t+'</p>'}
function fmt(n){return Number(n).toLocaleString('en-KE')}
async function api(opts){var r=await fetch(SCRIPT_URL+(opts.q||''),opts.body?{method:'POST',body:opts.body,headers:{'Content-Type':'text/plain;charset=utf-8'}}:{});return r.json()}
async function load(){
  $('gm').innerHTML='<p>Checking...</p>';
  try{var d=await api({q:'?code='+encodeURIComponent(code)});
   if(!d.ok){$('gm').innerHTML='<p class="er">That code was not accepted.</p>';return}
   ls('zrc',code);P=d.payments;$('gate').hidden=true;$('app').hidden=false;$('by').value=ls('zrb')||'';
   $('tag').innerHTML=d.tags.map(function(t){return'<option>'+t+'</option>'}).join('');draw()}
  catch(e){$('gm').innerHTML='<p class="er">Could not reach the upload service.</p>'}}
function draw(){var q=$('q').value.toLowerCase().trim(),h='';
 P.filter(function(p){return!q||(p.ref+p.payee+p.note+p.amount+p.cat).toLowerCase().indexOf(q)>-1}).slice(0,60).forEach(function(p){
  h+='<option value="'+p.ref+'">'+(p.files?'✓ ':'')+p.date.slice(0,11)+' · KES '+fmt(p.amount)+' · '+p.payee+'</option>'});
 $('pay').innerHTML=h;sel()}
function sel(){var p=P.filter(function(x){return x.ref===$('pay').value})[0];
 $('info').innerHTML=p?'<span class="pill">'+p.ref+'</span><span class="pill">'+p.cat+'</span>'+(p.files?'<span class="pill ok">'+p.files+' receipt'+(p.files>1?'s':'')+' saved</span>':'<span class="pill">no receipt yet</span>'):'';
 if(p){var o=$('tag').options;for(var i=0;i<o.length;i++)if(o[i].text.toLowerCase().replace(/&/g,'and')===p.cat.toLowerCase().replace(/&/g,'and')){$('tag').selectedIndex=i;break}}}
function shrink(f){return new Promise(function(res,rej){
 if(f.type==='application/pdf'){var r=new FileReader();r.onload=function(){res({mime:f.type,data:r.result.split(',')[1]})};r.onerror=rej;r.readAsDataURL(f);return}
 var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,1700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.8).split(',')[1]})};im.onerror=rej;im.src=u})}
$('go').onclick=function(){code=$('code').value;load()};
$('q').oninput=draw;$('pay').onchange=sel;
$('up').onclick=async function(){
 var ref=$('pay').value,fs=$('file').files;if(!ref)return msg('Pick the payment first.','er');if(!fs.length)return msg('Choose a receipt photo or PDF.','er');
 ls('zrb',$('by').value);$('up').disabled=true;var done=0,links=[];
 try{for(var i=0;i<fs.length;i++){msg('Uploading '+(i+1)+' of '+fs.length+'...');var f=await shrink(fs[i]);
   var d=await api({body:JSON.stringify({code:code,ref:ref,tag:$('tag').value,note:$('note').value,by:$('by').value,mime:f.mime,data:f.data})});
   if(!d.ok)throw new Error(d.error);done++;links.push('<a href="'+d.link+'" target="_blank" rel="noopener">'+d.name+'</a>')}
  msg('Saved '+done+' file'+(done>1?'s':'')+': '+links.join(', '),'ok');$('file').value='';$('note').value='';
  P.forEach(function(p){if(p.ref===ref)p.files+=done});sel()}
 catch(e){msg('Not saved: '+e.message+(done?' ('+done+' saved first)':''),'er')}
 $('up').disabled=false};
var sv=ls('zrc');if(sv){$('code').value=sv;code=sv;load()}
</script></body></html>
